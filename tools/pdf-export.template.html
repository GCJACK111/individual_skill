<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>文献总结 · PDF 导出</title>
<style>
:root{color-scheme:light;--ink:#192a35;--muted:#526671;--line:#d6e1e4;--green:#125f59;--paper:#fff;--bg:#edf3f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.65}main{width:min(1040px,calc(100% - 36px));margin:42px auto 24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-.03em;margin:8px 0 10px;line-height:1.3}.intro{max-width:780px;margin:0 0 26px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 10px 35px #193d3710;padding:26px}label{display:block;font-weight:650;font-size:14px;margin-bottom:8px}.optional{font-size:12px;font-weight:400;color:var(--muted)}input[type=text],textarea{width:100%;border:1px solid #b9cbce;border-radius:9px;background:#fbfdfd;color:var(--ink);padding:11px 13px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #125f5915}textarea{display:block;resize:vertical;min-height:380px;line-height:1.75;font-size:14px;font-family:ui-monospace,SFMono-Regular,Consolas,"Microsoft YaHei",monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:21px}.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{justify-content:space-between;margin:0 0 9px}.toolbar label{margin:0}.mini-actions{display:flex;gap:8px;align-items:center}button,.file-label{display:inline-flex;justify-content:center;align-items:center;gap:6px;cursor:pointer;border:1px solid #cbd8da;border-radius:8px;padding:9px 14px;color:var(--ink);background:#fff;font:inherit;font-size:13px;text-decoration:none;line-height:1.4}.file-label{font-weight:400;margin:0}button:hover,.file-label:hover{background:#eff6f4}button:focus-visible,.file-label:focus-within,a:focus-visible{outline:3px solid #3d948a;outline-offset:3px}button:disabled{cursor:wait;opacity:.6}.primary{background:var(--green);border-color:var(--green);color:#fff;padding:12px 23px;font-size:15px;font-weight:650}.primary:hover{background:#0a4c47}.actions{margin-top:19px;justify-content:space-between}.count{color:var(--muted);font-size:12px}#status{margin:17px 0 0;font-size:13px;color:var(--muted);min-height:24px}#status.error{color:#a12c2c}#download-link{display:inline-block;margin:10px 0 0;color:var(--green);font-weight:650}#download-link[hidden]{display:none}.note{font-size:12px;color:var(--muted);margin:16px 0 0;padding-top:15px;border-top:1px solid var(--line)}footer{color:var(--muted);font-size:12px;margin:18px 2px 0}footer a{color:inherit}input[type=file]{position:absolute;width:1px;height:1px;opacity:0} @media(max-width:640px){main{margin-top:25px}.card{padding:18px}.row{grid-template-columns:1fr;gap:15px}.toolbar{gap:10px}.mini-actions{flex-wrap:wrap}textarea{min-height:360px}.actions{align-items:flex-start;flex-direction:column}.primary{width:100%}}
</style>
</head>
<body>
<main>
<div class="eyebrow">PAPER LOGIC SIMPLIFIER</div>
<h1>把完整总结，变成一份 PDF</h1>
<p class="intro">在聊天窗口复制总结正文，粘贴到下方，再点击下载。支持中文、标题、列表、表格和代码；长文会自动分页。无需安装软件或登录。</p>
<section class="card" aria-label="PDF 导出表单">
<div class="row">
<div><label for="title">文档标题 <span class="optional">（可选）</span></label><input type="text" id="title" placeholder="例如：某篇论文的精读总结" maxlength="240"></div>
<div><label for="filename">下载文件名 <span class="optional">（可选）</span></label><input type="text" id="filename" placeholder="文献精读总结.pdf" maxlength="160"></div>
</div>
<div class="toolbar"><label for="source">总结正文 <span class="optional">（支持 Markdown）</span></label><div class="mini-actions"><label class="file-label">导入 .md / .txt<input type="file" id="import-file" accept=".md,.txt,text/plain,text/markdown"></label><button type="button" id="example">试用示例</button></div></div>
<textarea id="source" placeholder="请粘贴完整总结，包括基本信息、方法、数据与结果、结论和后续问答……" spellcheck="false"></textarea>
<div class="actions"><button type="button" class="primary" id="generate">下载 PDF</button><span class="count" id="count">0 字符</span></div>
<p id="status" role="status" aria-live="polite">正文只在当前浏览器处理，不上传到服务器。关闭页面后不会保存。</p>
<a id="download-link" hidden>点击下载已生成的 PDF</a>
<p class="note">图片以说明文字保留，公式以原始文本保留。建议先检查聊天总结是否完整，再导出。若浏览器未自动下载，生成后可点击下方的下载链接。</p>
</section>
<footer>文献逻辑梳理与简化总结 · <a href="https://github.com/GCJACK111/paper_skill" target="_blank" rel="noopener noreferrer">开源仓库与安装说明</a> · 主技能的分析结构和功能保持不变。</footer>
</main>
<script>/*__PDFMAKE__*/</script>
<script>/*__MARKDOWNIT__*/</script>
<script>
(function(root){
'use strict';
const FONT_NAME='NotoSansSC-Regular.ttf';
const FONT_DATA='__CHINESE_FONT_BASE64__';
const safeLink=url=>/^(https?:\/\/|mailto:)/i.test(url||'')?url:undefined;
// Insert soft break opportunities into very long Latin tokens without truncating them.
const breakLong=s=>String(s).replace(/[^\s\u200b\u3000-\u9fff]{70,}/gu,token=>token.match(/.{1,45}/gu).join('\u200b'));
function inline(children){
  const spans=[];let strong=0,em=0,strike=0;const links=[];
  for(const t of children||[]){
    if(t.type==='strong_open'){strong++;continue}if(t.type==='strong_close'){strong--;continue}
    if(t.type==='em_open'){em++;continue}if(t.type==='em_close'){em--;continue}
    if(t.type==='s_open'){strike++;continue}if(t.type==='s_close'){strike--;continue}
    if(t.type==='link_open'){links.push(t.attrGet('href'));continue}if(t.type==='link_close'){links.pop();continue}
    let text='';
    if(t.type==='softbreak'||t.type==='hardbreak')text='\n';
    else if(t.type==='image')text='[图片说明：'+(t.content||'未提供说明')+']';
    else if(t.type==='text'||t.type==='code_inline'||t.type==='html_inline')text=t.content;
    else if(t.content)text=t.content;
    if(text){const span={text:breakLong(text)};if(strong>0)span.bold=true;if(em>0)span.italics=true;if(strike>0)span.decoration='lineThrough';if(t.type==='code_inline'){span.background='#eef2f3';span.fontSize=9}const url=safeLink(links[links.length-1]);if(url){span.link=url;span.color='#126a62';span.decoration='underline'}spans.push(span)}
  }
  return spans.length?spans:[{text:' '}];
}
function closing(tokens,start,end){const type=tokens[start].type.replace(/_open$/,'');let depth=0;for(let k=start;k<end;k++){if(tokens[k].type===type+'_open')depth++;if(tokens[k].type===type+'_close'&&--depth===0)return k}return end}
function tableNode(tokens,start,end){
  const rows=[];let row=null,head=false;
  for(let k=start+1;k<end;k++){const t=tokens[k];if(t.type==='thead_open')head=true;if(t.type==='tr_open')row=[];if(t.type==='th_open'||t.type==='td_open'){const next=tokens[k+1];row.push({text:inline(next&&next.type==='inline'?next.children:[]),bold:t.type==='th_open',fillColor:t.type==='th_open'?'#e9f2f0':undefined,margin:[0,3,0,3]})}if(t.type==='tr_close'&&row){rows.push(row);row=null}}
  if(!rows.length)return [];
  const cols=Math.max(...rows.map(r=>r.length));for(const r of rows)while(r.length<cols)r.push({text:' '});
  const tooTall=rows.some(r=>r.some(c=>c.text.map(s=>s.text).join('').length>650));
  if(cols>7||tooTall){
    const result=[];const header=head?rows[0]:null;
    for(let r=head?1:0;r<rows.length;r++){
      result.push({text:'表格第 '+(head?r:r+1)+' 行',fontSize:10,bold:true,color:'#12645d',margin:[0,7,0,3]});
      for(let c=0;c<cols;c++){const label=header?header[c].text.map(s=>s.text).join(''):'列 '+(c+1);result.push({text:[{text:label+'：',bold:true},...rows[r][c].text],fontSize:10,margin:[8,0,0,5]})}
    }return result;
  }
  return [{table:{headerRows:head?1:0,widths:Array(cols).fill('*'),body:rows},layout:'lightHorizontalLines',fontSize:9,lineHeight:1.3,margin:[0,8,0,12]}];
}
function blocks(tokens,start,end){
  const out=[];
  for(let i=start;i<end;i++){
    const t=tokens[i];
    if(t.type==='heading_open'){const e=closing(tokens,i,end);const next=tokens[i+1];out.push({text:inline(next&&next.type==='inline'?next.children:[]),style:'h'+t.tag.substring(1),headlineLevel:Number(t.tag.substring(1))});i=e;continue}
    if(t.type==='paragraph_open'){const e=closing(tokens,i,end);const next=tokens[i+1];out.push({text:inline(next&&next.type==='inline'?next.children:[]),margin:[0,0,0,8]});i=e;continue}
    if(t.type==='bullet_list_open'||t.type==='ordered_list_open'){
      const e=closing(tokens,i,end);const items=[];
      for(let k=i+1;k<e;k++){if(tokens[k].type!=='list_item_open')continue;const le=closing(tokens,k,e);const child=blocks(tokens,k+1,le);items.push({stack:child.length?child:[{text:' '}]});k=le}
      const node={margin:[0,2,0,8]};if(t.type==='bullet_list_open')node.ul=items;else {node.ol=items;node.start=Number(t.attrGet('start')||1)}out.push(node);i=e;continue;
    }
    if(t.type==='blockquote_open'){const e=closing(tokens,i,end);out.push({stack:blocks(tokens,i+1,e),margin:[14,5,0,8],color:'#4c6570'});i=e;continue}
    if(t.type==='table_open'){const e=closing(tokens,i,end);out.push(...tableNode(tokens,i,e));i=e;continue}
    if(t.type==='fence'||t.type==='code_block'){
      if(t.info)out.push({text:'代码 · '+t.info,fontSize:8,color:'#55706e',margin:[0,7,0,3]});
      const codeLines=t.content.replace(/\n$/,'').split('\n');
      for(const line of codeLines)out.push({text:breakLong(line.replace(/\t/g,'    '))||' ',fontSize:8.5,lineHeight:1.25,preserveLeadingSpaces:true,margin:[8,0,0,2],color:'#354f5a'});
      out.push({text:' ',fontSize:3,margin:[0,0,0,5]});continue;
    }
    if(t.type==='hr'){out.push({canvas:[{type:'line',x1:0,y1:0,x2:482,y2:0,lineWidth:.6,lineColor:'#cbdada'}],margin:[0,9,0,12]});continue}
    if(t.type==='inline')out.push({text:inline(t.children),margin:[0,0,0,8]});
    else if(t.content)out.push({text:breakLong(t.content),margin:[0,0,0,8]});
  }
  return out;
}
function buildDoc(source,title){
  if(!source||!source.trim())throw new Error('请先粘贴总结正文。');
  if(!root.markdownit)throw new Error('导出组件不完整，请重新下载完整的 PDF 导出工具。');
  const md=root.markdownit({html:false,linkify:false,typographer:false,breaks:false});
  const tokens=md.parse(source,{});
  const content=blocks(tokens,0,tokens.length);
  const name=(title||'').trim();
  if(name)content.unshift({text:name,style:'documentTitle',margin:[0,0,0,20]});
  return {info:{title:name||'文献精读总结',author:'',subject:'文献逻辑梳理与简化总结'},pageSize:'A4',pageMargins:[52,48,52,54],defaultStyle:{font:'PaperChinese',fontSize:10.5,lineHeight:1.55,color:'#192a35'},styles:{documentTitle:{fontSize:23,bold:true,color:'#125f59'},h1:{fontSize:19,bold:true,color:'#125f59',margin:[0,15,0,10]},h2:{fontSize:15,bold:true,color:'#183c47',margin:[0,13,0,8]},h3:{fontSize:12.5,bold:true,color:'#183c47',margin:[0,11,0,6]},h4:{fontSize:11.5,bold:true,margin:[0,9,0,5]},h5:{fontSize:10.5,bold:true,margin:[0,8,0,5]},h6:{fontSize:10.5,bold:true,margin:[0,7,0,5]}},content,footer:function(currentPage,pageCount){return {text:currentPage+' / '+pageCount,font:'PaperChinese',fontSize:8,color:'#687f86',alignment:'center',margin:[0,17,0,0]}},pageBreakBefore:function(currentNode,followingNodesOnPage){return !!currentNode.headlineLevel&&followingNodesOnPage.length===0}};
}
let fontReady=false;
function prepareFont(){
  if(fontReady)return;
  if(!root.pdfMake||typeof root.pdfMake.createPdf!=='function')throw new Error('PDF 组件未载入，请重新下载完整工具后打开。');
  if(FONT_DATA.indexOf('__CHINESE_')===0)throw new Error('中文字体未打包，请使用仓库中已构建的完整导出页面。');
  const files={};files[FONT_NAME]=FONT_DATA;
  root.pdfMake.addVirtualFileSystem(files);
  root.pdfMake.fonts={PaperChinese:{normal:FONT_NAME,bold:FONT_NAME,italics:FONT_NAME,bolditalics:FONT_NAME}};
  fontReady=true;
}
root.PaperPdf={buildDoc,prepareFont};
if(!root.document)return;
const $=id=>root.document.getElementById(id);
const source=$('source'),title=$('title'),filename=$('filename'),generate=$('generate'),status=$('status'),download=$('download-link');
let blobUrl=null;
function updateCount(){$('count').textContent=Array.from(source.value).length.toLocaleString('zh-CN')+' 字符'}
function message(text,error){status.textContent=text;status.className=error?'error':''}
function resetDownload(){if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}download.hidden=true;download.removeAttribute('href')}
function finishError(err){generate.disabled=false;generate.textContent='下载 PDF';message('生成失败：'+(err&&err.message?err.message:String(err)),true)}
source.addEventListener('input',()=>{updateCount();resetDownload()});
$('import-file').addEventListener('change',async event=>{
  const f=event.target.files[0];if(!f)return;
  if(source.value.trim()&&!root.confirm('导入文件会替换当前正文，是否继续？')){event.target.value='';return}
  try{source.value=await f.text();updateCount();resetDownload();message('已导入 '+f.name+'，可检查内容后下载 PDF。',false)}catch(e){message('无法读取这个文件：'+e.message,true)}event.target.value='';
});
$('example').addEventListener('click',()=>{
  if(source.value.trim()&&!root.confirm('示例会替换当前正文，是否继续？'))return;
  source.value='# 文献精读总结（排版示例）\n\n> 本示例只演示格式，不对应真实论文。\n\n## 基本信息\n\n- 标题：演示论文\n- 作者与年份：示例信息\n\n## 背景与研究问题\n\n研究希望理解输入条件如何影响预测结果。**核心问题**是：这种关联是否足够稳定，可以用于新的样本？\n\n## 方法与数据\n\n1. 明确研究问题。\n2. 区分训练数据与测试数据。\n3. 比较不同方法的表现。\n\n| 比较内容 | 需要说明的信息 |\n| --- | --- |\n| 数据集 | 来源、规模与划分方式 |\n| 结果 | 评价指标与适用范围 |\n\n## 结果解释\n\n指标改善是实验观察；是否存在因果关系，需要额外的研究设计。公式以原始文本保留：$y = ax + b$。\n\n```text\n输入材料 → 逻辑梳理 → 结构化总结 → PDF\n```\n\n## 下一步问题\n\n- 如何判断数据是否有代表性？\n- 方法能否迁移到新的场景？\n- 哪些结果需要进一步验证？\n';
  updateCount();resetDownload();message('已载入排版示例，可点击“下载 PDF”试用。',false);
});
generate.addEventListener('click',async()=>{
  if(!source.value.trim()){message('请先粘贴总结正文。',true);source.focus();return}
  resetDownload();generate.disabled=true;generate.textContent='正在生成…';message('正在排版并生成 PDF，长文可能需要稍等。',false);
  await new Promise(resolve=>root.requestAnimationFrame(()=>root.setTimeout(resolve,20)));
  try{
    prepareFont();const doc=buildDoc(source.value,title.value);
    let name=(filename.value.trim()||title.value.trim()||'文献精读总结').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_');if(!/\.pdf$/i.test(name))name+='.pdf';
    root.pdfMake.createPdf(doc).getBlob(blob=>{
      try{if(!blob||blob.size<100)throw new Error('生成的 PDF 不完整，请重试。');blobUrl=URL.createObjectURL(blob);download.href=blobUrl;download.download=name;download.hidden=false;download.textContent='点击下载已生成的 PDF（'+(blob.size/1024/1024).toFixed(2)+' MB）';download.click();generate.disabled=false;generate.textContent='下载 PDF';message('PDF 已生成。若没有自动下载，请点击下方链接；正文仍保留在当前页面。',false)}catch(e){finishError(e)}
    });
  }catch(e){finishError(e)}
});
root.addEventListener('unhandledrejection',event=>{if(generate.disabled){event.preventDefault();finishError(event.reason)}});
root.addEventListener('beforeunload',()=>{if(blobUrl)URL.revokeObjectURL(blobUrl)});
})(typeof window!=='undefined'?window:globalThis);
</script>
</body>
</html>
